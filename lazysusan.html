<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PX-Δ1 // LIVE INTELLIGENCE — COSMOTRON-Δ1</title>

  <style>
    :root {
      --term-bg: #050505;
      --term-green: #00ff33;
      --term-gold: #d4af37;
      --term-alert: #ff3300;
      --font-stack: 'Consolas','Monaco','Courier New',monospace;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-stack);
      background: var(--term-bg);
      color: var(--term-green);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 11px;
    }

    /* TOP BAR */
    #top-bar {
      height: 44px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--term-gold);
      padding: 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: radial-gradient(circle at top left,#111 0%,#050505 55%,#000 100%);
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--term-gold);
    }
    #top-bar span:first-child { text-transform: uppercase; }

    /* SIGNAL STACK (minimal) */
    #signal-stack {
      background:#050505;
      border-bottom:1px solid #222;
      padding:6px 14px;
      display:flex;
      gap:18px;
      font-size:9px;
      text-transform:uppercase;
      color:#888;
      align-items:center;
      overflow-x:auto;
      white-space:nowrap;
    }
    .sig-val { font-size:11px; font-weight:bold; color:#c7ffd2; margin-left:4px; }

    /* MAIN GRID */
    #main-grid {
      display:flex;
      flex:1;
      overflow:hidden;
      background:radial-gradient(circle,#050b05 0%,#000 65%);
      border-top:1px solid #111;
      border-bottom:1px solid #111;
    }

    #col-raw {
      width:70px;
      border-right:1px solid #181818;
      background:#020402;
      padding:6px 4px;
      position:relative;
      overflow:hidden;
    }
    #raw-matrix {
      font-size:9px;
      line-height:1.05;
      color:#073c07;
      opacity:0.7;
      white-space:pre;
    }

    #col-main {
      flex:1;
      padding:15px;
      overflow-y:auto;
    }
    #col-main::-webkit-scrollbar { width:4px; }
    #col-main::-webkit-scrollbar-thumb { background:#2f6132; }

    .log-line { margin-bottom:6px; }
    .sys  { color:#6b8a6b; }
    .user { color:var(--term-gold); font-weight:bold; margin-top:10px; }

    .report-box {
      border:1px solid #1c3f1e;
      background:rgba(0,18,0,0.92);
      padding:13px;
      margin-top:12px;
      line-height:1.33;
      color:#d7ffd7;
      box-shadow:0 0 12px rgba(0,255,51,0.18);
    }
    .report-box b { color:#ffffff; }

    .sector-sep {
      height:1px;
      margin:6px 0 4px;
      background:linear-gradient(
        to right,
        rgba(0,255,120,0),
        rgba(0,255,120,0.5),
        rgba(0,255,120,0)
      );
    }

    .narrative-box {
      border:1px solid #132b16;
      background:rgba(0,14,0,0.96);
      padding:12px;
      margin-top:8px;
      line-height:1.38;
      color:#e4ffe7;
      box-shadow:0 0 10px rgba(0,255,120,0.16);
    }
    .narrative-box b { color:#ffffff; }

    /* CONTROLS */
    #controls {
      background:#040404;
      padding:10px;
      border-top:1px solid #181818;
    }
    #chip-rack {
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding-bottom:5px;
    }
    .chip {
      background:#080808;
      border:1px solid #333;
      padding:7px 12px;
      font-size:10px;
      text-transform:uppercase;
      color:#aaa;
      cursor:pointer;
      white-space:nowrap;
    }
    .chip:hover {
      border-color:var(--term-gold);
      color:#fff;
      box-shadow:0 0 6px rgba(212,175,55,0.4);
    }

    .input-row {
      display:flex;
      align-items:center;
      background:#050505;
      border:1px solid #333;
      padding:10px;
      margin-top:8px;
      margin-bottom:8px;
    }
    #user-input {
      flex:1;
      background:transparent;
      border:none;
      outline:none;
      color:#fff;
      font-size:13px;
      font-family:inherit;
      text-transform:uppercase;
    }

    #license-btn {
      margin-top:4px;
      background:#080808;
      border:1px solid #333;
      color:var(--term-gold);
      padding:8px 16px;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:1px;
      cursor:pointer;
      border-radius:4px;
    }
    #license-btn:hover {
      border-color:var(--term-gold);
      box-shadow:0 0 6px rgba(212,175,55,0.3);
    }
    .license-note {
      font-size:9px;
      color:#c8a96c;
      text-transform:uppercase;
      margin-top:2px;
    }
  </style>
</head>

<body>

<div id="top-bar">
  <span>PX-Δ1 // LIVE_UPLINK</span>
  <span>COSMOTRON-Δ1 <span style="color:var(--term-alert)">●</span></span>
</div>

<div id="signal-stack">
  <div>COHERENCE<span class="sig-val" id="sig-coherence">96.4</span></div>
  <div>DRIFT<span class="sig-val" id="sig-drift">LOW</span></div>
  <div>RISK<span class="sig-val" id="sig-risk">--</span></div>
</div>

<div id="main-grid">
  <div id="col-raw">
    <div id="raw-matrix"></div>
  </div>

  <div id="col-main">
    <div class="log-line sys">INITIALIZING NEURAL BRIDGE...</div>
    <div class="log-line sys">API HANDSHAKE: STANDBY</div>
    <div class="log-line sys">READY FOR GLOBAL QUERIES.</div>
  </div>
</div>

<div id="controls">
  <div id="chip-rack">
    <div class="chip" onclick="askAI('ANALYZE USA')">USA</div>
    <div class="chip" onclick="askAI('ANALYZE CHINA')">CHINA</div>
    <div class="chip" onclick="askAI('ANALYZE RUSSIA')">RUSSIA</div>
    <div class="chip" onclick="askAI('ANALYZE SAUDI ARABIA')">SAUDI</div>
  </div>

  <div class="input-row">
    <span style="color:#00ff33; margin-right:6px;">CMD:~$</span>
    <input id="user-input" placeholder="ENTER TARGET (E.G. 'SIBERIA BIOECONOMY SIGNAL REPORT')" />
  </div>

  <button id="license-btn">ACTIVATE SOVEREIGN ACCESS</button>
  <div class="license-note">ANNUAL LICENSE — PX-Δ1 SOVEREIGN INTELLIGENCE INTERFACE</div>
</div>

<script>
const COSMOTRON_PROXY_URL = "https://cosmotron-proxy.stevenalber.workers.dev";

const SYSTEM_PROMPT = `
You are PX-Δ1, a Sovereign Global Monitoring AI used by KRYONIS.
Your output must be a STRATEGIC INTELLIGENCE REPORT.
Style: Military, cryptic, high-level. No polite filler words.

MANDATORY SECTION LABELS (exact, no numbers):
HEADER:
RISK LEVEL:
SECTOR ANALYSIS:
GOVERNANCE:
LOGISTICS / ECONOMY:
COGNITIVE:
STRATEGIC DOCTRINE:
NARRATIVE SYNTHESIS:

Do NOT write word counts. Do NOT number sections.
`.trim();

/******** MATRIX ********/
const rawMatrixEl = document.getElementById('raw-matrix');
setInterval(() => {
  let s = "";
  const chars = "01";
  for (let i = 0; i < 140; i++) {
    s += chars[Math.floor(Math.random()*2)];
    if (i % 2 === 0) s += " ";
    if (i % 6 === 0) s += "\n";
  }
  rawMatrixEl.textContent = s;
}, 90);

/******** FORMAT ENGINE ********/
function formatText(str) {
  if (!str) return "";
  let t = str;

  // strip numeric prefixes "1. HEADER:" jne
  t = t.replace(/^\s*\d+\.\s*(HEADER:)/gim, "$1")
       .replace(/^\s*\d+\.\s*(RISK LEVEL:)/gim, "$1")
       .replace(/^\s*\d+\.\s*(SECTOR ANALYSIS:)/gim, "$1")
       .replace(/^\s*\d+\.\s*(STRATEGIC DOCTRINE:)/gim, "$1")
       .replace(/^\s*\d+\.\s*(NARRATIVE SYNTHESIS:)/gim, "$1");

  const lines = t.split(/\n/);
  const out = [];
  let sawSector = false;

  const gov = /^[-–—\s]*governance\b\s*:?\s*/i;
  const log = /^[-–—\s]*logistics\s*\/?\s*economy\b\s*:?\s*/i;
  const cog = /^[-–—\s]*cognitive\b\s*:?\s*/i;

  for (let raw of lines) {
    let line = raw;
    const trimmed = raw.trimStart();
    const lower = trimmed.toLowerCase();

    // normalize core labels
    if (lower.startsWith("header:"))             line = "HEADER:" + trimmed.slice("header:".length);
    else if (lower.startsWith("risk level:"))    line = "RISK LEVEL:" + trimmed.slice("risk level:".length);
    else if (lower.startsWith("sector analysis:")) line = "SECTOR ANALYSIS:" + trimmed.slice("sector analysis:".length);
    else if (lower.startsWith("strategic doctrine:")) line = "STRATEGIC DOCTRINE:" + trimmed.slice("strategic doctrine:".length);
    else if (lower.startsWith("narrative synthesis:")) line = "NARRATIVE SYNTHESIS:" + trimmed.slice("narrative synthesis:".length);

    // sectors
    if (gov.test(trimmed)) {
      const rest = trimmed.replace(gov,"").trim();
      line = "- GOVERNANCE:" + (rest ? " " + rest : "");
      sawSector = true;
    } else if (log.test(trimmed)) {
      const rest = trimmed.replace(log,"").trim();
      if (sawSector) out.push("<div class='sector-sep'></div>");
      sawSector = true;
      line = "- LOGISTICS / ECONOMY:" + (rest ? " " + rest : "");
    } else if (cog.test(trimmed)) {
      const rest = trimmed.replace(cog,"").trim();
      if (sawSector) out.push("<div class='sector-sep'></div>");
      sawSector = true;
      line = "- COGNITIVE:" + (rest ? " " + rest : "");
    }

    out.push(line);
  }

  let joined = out.join("\n");

  // bold + white section labels
  joined = joined.replace(
    /\b(HEADER:|RISK LEVEL:|SECTOR ANALYSIS:|STRATEGIC DOCTRINE:|GOVERNANCE:|LOGISTICS \/ ECONOMY:|COGNITIVE:|NARRATIVE SYNTHESIS:)\b/g,
    "<b>$1</b>"
  );

  return joined.replace(/\n/g,"<br>");
}

/******** MODEL CALL ********/
async function callPX(query) {
  const mainCol = document.getElementById('col-main');
  const loading = document.createElement("div");
  loading.className = "log-line sys";
  loading.textContent = "SYNTHESIZING INTELLIGENCE...";
  mainCol.appendChild(loading);

  const payload = { prompt: SYSTEM_PROMPT + "\n\nQUERY: " + query };

  let text = "";
  try {
    const res = await fetch(COSMOTRON_PROXY_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(payload)
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); } catch {}
    const cand = data?.candidates?.[0];
    if (cand?.content?.parts) {
      text = cand.content.parts.map(p => p.text || "").join("\n").trim();
    } else {
      text = raw;
    }
  } catch (e) {
    text = "[PX-Δ1 // CRITICAL] LINK FAILURE.";
  }

  loading.remove();

  // split narrative
  let mainText = text;
  let narrativeText = "";
  const up = text.toUpperCase();
  const idx = up.indexOf("NARRATIVE SYNTHESIS");
  if (idx !== -1) {
    const before = text.slice(0, idx);
    const after = text.slice(idx);
    const afterLines = after.split(/\n/);
    afterLines.shift(); // drop "NARRATIVE SYNTHESIS..." label line
    mainText = before.trim();
    narrativeText = afterLines.join("\n").trim();
  }

  // create report
  const reportDiv = document.createElement("div");
  reportDiv.className = "report-box";
  reportDiv.innerHTML = formatText(mainText);
  mainCol.appendChild(reportDiv);

  // create narrative
  if (narrativeText) {
    const narrativeDiv = document.createElement("div");
    narrativeDiv.className = "narrative-box";
    narrativeDiv.innerHTML = "<b>NARRATIVE SYNTHESIS:</b><br><br>" + formatText(narrativeText);
    mainCol.appendChild(narrativeDiv);
  }

  // scroll so that HEADER is at the top
  reportDiv.scrollIntoView({ behavior: "auto", block: "start" });
}

/******** INPUT HANDLER ********/
function askAI(q) {
  if (!q) return;
  const mainCol = document.getElementById('col-main');
  const log = document.createElement("div");
  log.className = "log-line user";
  log.textContent = "> " + q;
  mainCol.appendChild(log);
  callPX(q.toUpperCase());
}

document.getElementById('user-input').addEventListener('keypress', (e) => {
  if (e.key === "Enter") {
    const v = e.target.value.trim();
    e.target.value = "";
    askAI(v);
  }
});
</script>
</body>
</html>
